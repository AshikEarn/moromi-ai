‎<!DOCTYPE html>
‎<html lang="bn">
‎<head>
‎  <meta charset="UTF-8">
‎  <meta name="viewport" content="width=device-width, initial-scale=1.0">
‎  <title>Moromi Test</title>
‎</head>
‎<body style="padding: 20px; font-family: sans-serif; background-color: #f9f9f9;">
‎
‎  <h2>মরমী এআই (Moromi AI) - সংযোগ পরীক্ষা</h2>
‎  <p>নিচে মেসেজ লিখে পরীক্ষা করুন:</p>
‎
‎  <div style="margin-top: 15px;">
‎    <input type="text" id="msg" placeholder="এখানে লিখুন..." style="padding: 10px; width: 70%; max-width: 300px; font-size: 16px;">
‎    <button onclick="send()" style="padding: 10px 15px; font-size: 16px; cursor: pointer;">পাঠান</button>
‎  </div>
‎
‎  <div id="reply" style="margin-top: 20px; padding: 15px; background: #fff; border: 1px solid #ccc; min-height: 50px; font-size: 16px;"></div>
‎
‎  <script>
‎    async function send() {
‎      const input = document.getElementById('msg').value.trim();
‎      const replyDiv = document.getElementById('reply');
‎
‎      if (!input) {
‎        replyDiv.innerText = 'দয়া করে কিছু লিখুন।';
‎        return;
‎      }
‎
‎      replyDiv.innerText = 'অপেক্ষা করুন, এআই উত্তর দিচ্ছে...';
‎
‎      try {
‎        const res = await fetch('/api/chat', {
‎          method: 'POST',
‎          headers: { 'Content-Type': 'application/json' },
‎          body: JSON.stringify({ message: input })
‎        });
‎
‎        const data = await res.json();
‎
‎        if (res.ok) {
‎          replyDiv.innerText = 'উত্তর: ' + (data.reply || 'কোনো উত্তর আসে নি');
‎        } else {
‎          replyDiv.innerText = 'সার্ভার এরর (Status ' + res.status + '): ' + (data.error || JSON.stringify(data));
‎        }
‎      } catch (e) {
‎        replyDiv.innerText = 'কানেকশন এরর: ' + e.message;
‎      }
‎    }
‎  </script>
‎
‎</body>
‎</html>

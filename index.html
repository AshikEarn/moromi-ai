<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মরমী (Moromi) - মানসিক স্বাস্থ্য সহকারী</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
    .chat-container { width: 100%; max-width: 480px; height: 90vh; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
    .chat-header { background: #1a5f7a; color: #ffffff; padding: 18px; text-align: center; }
    .chat-header h2 { font-size: 1.3rem; margin-bottom: 4px; }
    .chat-header p { font-size: 0.85rem; opacity: 0.9; }
    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #fdfdfd; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
    .user { align-self: flex-end; background-color: #1a5f7a; color: white; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background-color: #e8f1f5; color: #222; border-bottom-left-radius: 2px; }
    .chat-input-area { padding: 12px; background: #ffffff; border-top: 1px solid #eee; display: flex; gap: 8px; }
    input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 24px; outline: none; font-size: 0.95rem; }
    input:focus { border-color: #1a5f7a; }
    button { background: #1a5f7a; color: white; border: none; padding: 12px 20px; border-radius: 24px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    button:hover { background: #13485c; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h2>মরমী (Moromi)</h2>
      <p>আপনার অনুভূতি ও মনের কথা শেয়ার করার নিরাপদ স্থান</p>
    </div>
    
    <div class="chat-messages" id="chatMessages">
      <div class="message bot">নমস্কার/আসসালামু আলাইকুম! আমি 'মরমী'। আপনার মনের যেকোনো অনুভূতি বা কষ্টের কথা নির্দ্বিধায় বলতে পারেন, আমি শুনছি...</div>
    </div>
    
    <div class="chat-input-area">
      <input type="text" id="userInput" placeholder="আপনার কথা লিখুন..." onkeypress="if(event.key === 'Enter') sendMessage()">
      <button onclick="sendMessage()">পাঠান</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const inputField = document.getElementById('userInput');
      const text = inputField.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      inputField.value = '';

      const loadingMsg = appendMessage('মরমী চিন্তা করছে...', 'bot');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();

        if (response.ok) {
          loadingMsg.innerText = data.reply || 'কোনো উত্তর পাওয়া যায়নি।';
        } else {
          loadingMsg.innerText = 'সাময়িক সমস্যা: ' + (data.error || 'উত্তর আনা সম্ভব হয়নি।');
        }
      } catch (err) {
        loadingMsg.innerText = 'সার্ভারের সাথে সংযোগে ত্রুটি ঘটেছে। কিছুক্ষণ পর আবার চেষ্টা করুন।';
      }
    }

    function appendMessage(text, sender) {
      const chatMessages = document.getElementById('chatMessages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      msgDiv.innerText = text;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return msgDiv;
    }
  </script>

</body>
</html>

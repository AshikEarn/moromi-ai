<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মরমী (Moromi) - আপনার জীবনের বিশ্বস্ত সঙ্গী</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
    
    .chat-container { width: 100%; max-width: 480px; height: 95vh; background: #ffffff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
    
    /* Header */
    .chat-header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 15px; text-align: center; }
    .chat-header h2 { font-size: 1.3rem; margin-bottom: 4px; }
    .chat-header p { font-size: 0.85rem; opacity: 0.9; }

    /* Daily Reminder Widget */
    .reminder-card { background: #eef2f5; border-left: 4px solid #2a5298; margin: 10px; padding: 10px; border-radius: 8px; font-size: 0.85rem; color: #333; display: flex; justify-content: space-between; align-items: center; }
    .reminder-btn { background: #2a5298; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }

    /* Messages Area */
    .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #fafafa; }
    .message { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
    .bot-msg { background: #e3f2fd; color: #0d47a1; align-self: flex-start; border-bottom-left-radius: 2px; }
    .user-msg { background: #2a5298; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }

    /* Quick Action Buttons */
    .quick-buttons { display: flex; gap: 6px; padding: 0 10px 8px 10px; overflow-x: auto; white-space: nowrap; }
    .quick-btn { background: #ffffff; border: 1px solid #2a5298; color: #2a5298; padding: 6px 12px; border-radius: 16px; font-size: 0.8rem; cursor: pointer; flex-shrink: 0; }
    .quick-btn:hover { background: #2a5298; color: white; }

    /* Input Area */
    .chat-input-area { padding: 10px; background: white; border-top: 1px solid #eee; display: flex; gap: 8px; }
    .chat-input-area input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 0.95rem; }
    .chat-input-area button { background: #2a5298; color: white; border: none; padding: 10px 18px; border-radius: 20px; font-size: 0.95rem; cursor: pointer; font-weight: bold; }
    
    /* Emergency Helpline */
    .helpline { text-align: center; font-size: 0.75rem; padding: 6px; background: #fff3cd; color: #856404; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h2>মরমী (Moromi) 🤍</h2>
    <p>আপনার সুখে-দুঃখে পাশে থাকা এক অবাধ্য বন্ধু</p>
  </div>

  <div class="reminder-card">
    <span id="reminder-text">💡 "ধৈর্য ধরুন, নিশ্চয়ই কষ্টের পর স্বস্তি আসে।"</span>
    <button class="reminder-btn" onclick="changeReminder()">নতুন উপদেশ</button>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="message bot-msg">
      আসসালামু আলাইকুম। আমি মরমী। আপনার মনের প্রতিটি কথা শুনতে আমি প্রস্তুত। আজ আপনার দিনটি কেমন কাটছে?
    </div>
  </div>

  <div class="quick-buttons">
    <button class="quick-btn" onclick="sendQuick('আজ খুব একা লাগছে')">😔 খুব একা লাগছে</button>
    <button class="quick-btn" onclick="sendQuick('জীবনযুদ্ধে বড্ড ক্লান্ত')">💔 জীবনযুদ্ধে ক্লান্ত</button>
    <button class="quick-btn" onclick="sendQuick('আমাকে একটি সুন্দর উপদেশ দাও')">✨ সুন্দর উপদেশ</button>
    <button class="quick-btn" onclick="sendQuick('নামাজের সময় ও গুরুত্ব বলো')">🕌 নামাজের কথা</button>
  </div>

  <div class="chat-input-area">
    <input type="text" id="userInput" placeholder="আপনার মনের কথা লিখুন..." onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">পাঠান</button>
  </div>

  <div class="helpline">
    জরুরি মানসিক সহায়তার জন্য কান পেতে শুনবে 'কান পেতে রই': <b>09612119911</b>
  </div>
</div>

<script>
  const reminders = [
    "💡 'ধৈর্য ধরুন, নিশ্চয়ই কষ্টের পর স্বস্তি আসে।' - আল কুরআন",
    "🕌 পাঁচ ওয়াক্ত নামাজ মনের অশান্তি দূর করার সেরা মাধ্যম।",
    "🌱 জীবনযুদ্ধে টিকে থাকাটাই সবচেয়ে বড় বীরত্ব। আপনি একা নন।",
    "☕ আপনার পরিশ্রমে আপনার পরিবার সচল, নিজেকে নিয়ে গর্ব করুন।",
    "🤲 'আল্লাহ কারো ওপর তার সাধ্যের অতিরিক্ত বোঝা চাপান না।'"
  ];

  function changeReminder() {
    const randomIndex = Math.floor(Math.random() * reminders.length);
    document.getElementById('reminder-text').innerText = reminders[randomIndex];
  }

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    appendMessage(text, 'user-msg');
    input.value = '';

    const botMessageDiv = appendMessage('মরমী টাইপ করছে...', 'bot-msg');

    try {
      const response = await fetch('https://moromi-ai-9ccd.vercel.app/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });

      const data = await response.json();
      if (response.ok && data.reply) {
        botMessageDiv.innerText = data.reply;
      } else {
        botMessageDiv.innerText = 'দুঃখিত, কোনো সমস্যা হয়েছে। আবার চেষ্টা করুন।';
      }
    } catch (err) {
      botMessageDiv.innerText = 'নেটওয়ার্ক সমস্যা। আপনার ইন্টারনেট সংযোগ চেক করুন।';
    }
  }

  function appendMessage(text, className) {
    const container = document.getElementById('chatMessages');
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${className}`;
    msgDiv.innerText = text;
    container.appendChild(msgDiv);
    container.scrollTop = container.scrollHeight;
    return msgDiv;
  }

  function sendQuick(text) {
    document.getElementById('userInput').value = text;
    sendMessage();
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') sendMessage();
  }
</script>

</body>
</html>
